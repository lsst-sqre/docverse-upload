version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      # Only `default-days` is valid for the github-actions ecosystem; the
      # semver-*-days keys are unsupported here (they apply to semver ecosystems
      # like npm) and fail Dependabot config validation.
      default-days: 5
      # GitHub-published actions are exempt: they are first-party and low-risk,
      # so we take them without waiting out the cooldown window.
      exclude:
        - "actions/*"
        - "github/*"
    groups:
      actions:
        patterns:
          - "*"
        # Restrict the group to minor/patch so a major never lands inside it and
        # blocks the group's auto-merge; majors split out as individual PRs.
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
      semver-patch-days: 3
      # @actions/* packages are GitHub-published first-party deps; exempt them.
      exclude:
        - "@actions/*"
    groups:
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-dependencies:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
