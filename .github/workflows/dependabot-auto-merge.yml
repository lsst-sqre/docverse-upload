name: Dependabot Auto-Merge

# Enables auto-merge (squash) for Dependabot PRs that:
# 1. Pass CI, and
# 2. Are a patch or minor update.
#
# There is no separate "was dist/ rebuilt?" check: CI's "Verify generated/ and
# dist/ are up to date" gate already proves the bundle is in sync, so a green CI
# run is sufficient evidence. The dependabot-build workflow is what gets CI to
# green on runtime-dependency bumps.
#
# Update type comes from the `dependencies-{major,minor,patch}` label that
# dependabot-label.yml applies via dependabot/fetch-metadata (the authoritative
# source) — NOT from parsing the PR title. The gate is a fail-closed allowlist:
# auto-merge requires a `dependencies-patch` or `dependencies-minor` label. No
# label or a `dependencies-major` label ⇒ no auto-merge (left for manual review
# or the dependabot-merge skill).
#
# Security: Uses the workflow_run trigger to run in the context of the default
# branch, avoiding "pwn request" vulnerabilities. Verifies the PR author before
# taking any action.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

# Minimal permissions for security
permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Only run if CI succeeded and was triggered by a pull_request event
    if: >
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request'

    steps:
      - name: Generate GitHub App token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          # The App client-id is a non-sensitive identifier — stored as a
          # configuration variable (vars), available in every context.
          #
          # IMPORTANT: this workflow uses the workflow_run trigger, so it runs as
          # a normal Actions workflow in the default-branch context — NOT as a
          # Dependabot-triggered run. It therefore reads the ACTIONS secret store,
          # so CI_GH_APP_PRIVATE_KEY must exist as an *Actions* secret here. A
          # Dependabot secret is NOT visible to workflow_run. (This differs from
          # dependabot-build.yml, which is Dependabot-triggered and reads the
          # Dependabot secret of the same name.)
          client-id: ${{ vars.CI_GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_GH_APP_PRIVATE_KEY }}

      # Get PR information from the workflow run
      - name: Get PR number
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const pullRequests = context.payload.workflow_run.pull_requests;
            if (!pullRequests || pullRequests.length === 0) {
              console.log('No pull requests found for this workflow run');
              return null;
            }

            const prNumber = pullRequests[0].number;
            console.log(`Found PR #${prNumber}`);
            return prNumber;

      # Security: Verify PR is from Dependabot.
      # We fetch the full PR via the API to access author information, since the
      # workflow_run payload's pull_requests array contains simplified PR objects
      # that don't include the user property.
      - name: Verify Dependabot PR
        if: steps.pr.outputs.result != 'null'
        id: verify
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            console.log(`PR author: ${pr.user.login}`);

            if (pr.user.login !== 'dependabot[bot]') {
              console.log('Not a Dependabot PR, skipping');
              core.setOutput('is_dependabot', 'false');
              return;
            }

            core.setOutput('is_dependabot', 'true');
            core.setOutput('html_url', pr.html_url);
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('head_ref', pr.head.ref);

      # Determine the semver update type from the `dependencies-*` label applied
      # by dependabot-label.yml (which uses dependabot/fetch-metadata — the
      # authoritative source — in pull_request context). We can't run
      # fetch-metadata here because this workflow uses the workflow_run trigger
      # for security. Fail-closed allowlist: only dependencies-patch /
      # dependencies-minor are safe to merge; dependencies-major or no label at
      # all (e.g. labeling failed) keeps auto-merge disabled.
      - name: Get Dependabot metadata
        if: steps.verify.outputs.is_dependabot == 'true'
        id: metadata
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.result }};
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            const labels = pr.labels.map(l => l.name);
            console.log(`PR labels: ${labels.join(', ') || '(none)'}`);

            const isMajor = labels.includes('dependencies-major');
            const isMinor = labels.includes('dependencies-minor');
            const isPatch = labels.includes('dependencies-patch');
            const safe = isMinor || isPatch;                 // allowlist; major/none => false
            const updateType = isMajor ? 'dependencies-major'
                             : isMinor ? 'dependencies-minor'
                             : isPatch ? 'dependencies-patch'
                             : 'unknown';

            core.setOutput('update-type', updateType);
            core.setOutput('safe-to-merge', String(safe));
            console.log(`safe-to-merge=${safe} (update-type=${updateType})`);

      # Enable auto-merge if all conditions are met:
      # 1. PR is from Dependabot (verified above)
      # 2. Update is safe to merge (dependencies-patch / dependencies-minor label)
      - name: Enable auto-merge with squash
        if: >
          steps.verify.outputs.is_dependabot == 'true' && steps.metadata.outputs.safe-to-merge == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_URL: ${{ steps.verify.outputs.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Enabling auto-merge for $UPDATE_TYPE update"
          gh pr merge --auto --squash "$PR_URL" --repo "${{ github.repository }}"

      # Add comment for visibility
      - name: Comment on PR
        if: >
          steps.verify.outputs.is_dependabot == 'true' && steps.metadata.outputs.safe-to-merge == 'true'
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_NUMBER: ${{ steps.pr.outputs.result }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body \
            "🤖 **Auto-merge enabled**

            This Dependabot PR has been configured for auto-merge with squash strategy:
            - ✅ CI passed (generated/ and dist/ verified in sync)
            - ✅ Update type: \`$UPDATE_TYPE\`

            The PR will automatically merge once all branch protection requirements are satisfied."

      # Log when auto-merge is skipped
      - name: Log skip reason
        if: >
          steps.verify.outputs.is_dependabot == 'true' && steps.metadata.outputs.safe-to-merge != 'true'
        env:
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: |
          echo "Auto-merge skipped:"
          echo "  Update type: $UPDATE_TYPE"

          if [ "$UPDATE_TYPE" = "dependencies-major" ]; then
            echo "  Reason: Major version updates require manual review"
          elif [ "$UPDATE_TYPE" = "unknown" ]; then
            echo "  Reason: No dependencies-* label found (fail-closed; labeling may have failed or be pending)"
          fi
